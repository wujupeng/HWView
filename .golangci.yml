run:
  timeout: 5m
  go: "1.21"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - nakedret

linters-settings:
  goimports:
    local-prefixes: github.com/hwview/hwview
  errcheck:
    check-type-assertions: true
    check-blank: true